name: lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      # --frozen também prova que o uv.lock está em dia com o pyproject.toml.
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run ruff format --check
