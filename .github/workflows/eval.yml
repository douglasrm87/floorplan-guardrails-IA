name: eval

# Única workflow que fala com o Azure de verdade, e só sob demanda:
# as chaves ficam em Secrets do repositório, nunca no código.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --frozen
      # AZURE_OPENAI_API_VERSION não entra aqui de propósito: o caminho
      # /openai/v1 recusa o parâmetro api-version, e o cliente lê essa
      # variável do ambiente sozinho. Definida, ainda que vazia, ela quebra
      # todas as chamadas.
      - name: Run the evaluation suite
        env:
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
        run: |
          uv run python -m eval.run
